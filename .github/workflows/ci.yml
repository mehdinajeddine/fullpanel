name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
      - run: docker build -t harborlight:ci .
      - run: docker tag harborlight:ci harborlight:local
      - run: npm run test:package
  docker-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:docker
      - run: npm run test:proxy
      - run: npm run test:credentials
      - run: npm run test:git
      - run: npm run test:git-ssh
      - run: npm run test:github
      - run: npm run test:releases
      - run: npm run test:environment
      - run: docker pull alpine:3.21
      - run: npm run test:restore
        env:
          HARBORLIGHT_RESTORE_TEST_ENGINES: postgres,redis,app
      - run: npm run test:restore-recovery
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:restore-ui
      - run: npm run test:releases-ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: restore-ui-results
          path: .local/restore-ui/
  native-engines:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: mysql
            runner: ubuntu-latest
          - engine: mariadb
            runner: ubuntu-latest
          # MongoDB 8.3.13 refuses the Linux 6.19–7.0.13 kernel range.
          # Keep the real engine and restore checks on a supported host kernel.
          # https://jira.mongodb.org/browse/SERVER-136272
          - engine: mongo
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Record database host runtime
        run: docker info --format 'Kernel={{.KernelVersion}} OS={{.OperatingSystem}} Architecture={{.Architecture}}'
      - run: npm run test:engines
        env:
          ENGINE_KINDS: ${{ matrix.engine }}
      - run: npm run test:restore
        env:
          HARBORLIGHT_RESTORE_TEST_ENGINES: ${{ matrix.engine }}
