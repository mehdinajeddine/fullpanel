name: harborlight
services:
  panel:
    build: .
    image: harborlight:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /var/lib/harborlight
      HARBORLIGHT_MODE: docker
      HARBORLIGHT_EXPERIMENTAL_TERMINAL: ${HARBORLIGHT_EXPERIMENTAL_TERMINAL:-false}
    ports:
      - "127.0.0.1:${PANEL_PORT:-3000}:3000"
    volumes:
      - harborlight-data:/var/lib/harborlight
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - proxy
    labels:
      traefik.enable: "false"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  proxy:
    image: traefik:v3.6
    profiles: [proxy]
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=harborlight-proxy
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-}
      - --certificatesresolvers.letsencrypt.acme.storage=/certificates/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --api.dashboard=false
      - --log.level=INFO
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - harborlight-certificates:/certificates
    networks:
      - proxy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  proxy:
    name: harborlight-proxy

volumes:
  harborlight-data:
  harborlight-certificates:
